<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <pattern id="grassPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#86EFAC"/>
      <circle cx="10" cy="10" r="2" fill="#22C55E"/>
      <circle cx="30" cy="25" r="2" fill="#22C55E"/>
      <circle cx="20" cy="35" r="2" fill="#16A34A"/>
    </pattern>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="300" fill="url(#skyGrad)"/>
  
  <!-- Land -->
  <rect y="300" width="800" height="300" fill="url(#grassPattern)"/>
  
  <!-- Fence Posts -->
  <rect x="50" y="280" width="15" height="120" fill="#92400E"/>
  <rect x="150" y="280" width="15" height="120" fill="#92400E"/>
  <rect x="250" y="280" width="15" height="120" fill="#92400E"/>
  <rect x="350" y="280" width="15" height="120" fill="#92400E"/>
  <rect x="450" y="280" width="15" height="120" fill="#92400E"/>
  <rect x="550" y="280" width="15" height="120" fill="#92400E"/>
  <rect x="650" y="280" width="15" height="120" fill="#92400E"/>
  <rect x="740" y="280" width="15" height="120" fill="#92400E"/>
  
  <!-- Fence Rails -->
  <rect x="50" y="310" width="705" height="8" fill="#A16207"/>
  <rect x="50" y="360" width="705" height="8" fill="#A16207"/>
  
  <!-- Sign Post -->
  <rect x="350" y="200" width="12" height="150" fill="#78350F"/>
  
  <!-- For Sale Sign -->
  <rect x="280" y="180" width="150" height="60" fill="#FBBF24" stroke="#F59E0B" stroke-width="3" rx="5"/>
  <text x="355" y="205" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#92400E" text-anchor="middle">SE VENDE</text>
  <text x="355" y="225" font-family="Arial, sans-serif" font-size="14" fill="#92400E" text-anchor="middle">TERRENO</text>
  
  <!-- Trees in background -->
  <ellipse cx="120" cy="240" rx="40" ry="50" fill="#22C55E" opacity="0.6"/>
  <rect x="110" y="240" width="20" height="60" fill="#78350F"/>
  
  <ellipse cx="680" cy="250" rx="35" ry="45" fill="#22C55E" opacity="0.6"/>
  <rect x="672" y="250" width="16" height="50" fill="#78350F"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="80" rx="50" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="190" cy="85" rx="40" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="650" cy="100" rx="45" ry="28" fill="white" opacity="0.8"/>
</svg>
