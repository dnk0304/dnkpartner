<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none" role="img" aria-label="Motocicleta">
  <defs>
    <linearGradient id="bgMoto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef7f1"/>
      <stop offset="100%" stop-color="#dbece2"/>
    </linearGradient>
    <linearGradient id="tankMoto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f5d3a"/>
      <stop offset="100%" stop-color="#0f3320"/>
    </linearGradient>
    <linearGradient id="seatMoto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3530"/>
      <stop offset="100%" stop-color="#101814"/>
    </linearGradient>
    <linearGradient id="rimMoto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6efe9"/>
      <stop offset="100%" stop-color="#9fb4a6"/>
    </linearGradient>
    <radialGradient id="shadowMoto" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0f3320" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f3320" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgMoto)"/>
  <ellipse cx="400" cy="498" rx="260" ry="20" fill="url(#shadowMoto)"/>
  <!-- rear wheel -->
  <circle cx="610" cy="438" r="74" fill="#0a2517"/>
  <circle cx="610" cy="438" r="44" fill="url(#rimMoto)"/>
  <circle cx="610" cy="438" r="10" fill="#475e52"/>
  <!-- spokes -->
  <g stroke="#7f968a" stroke-width="3" opacity="0.7">
    <line x1="610" y1="398" x2="610" y2="478"/>
    <line x1="570" y1="438" x2="650" y2="438"/>
    <line x1="582" y1="410" x2="638" y2="466"/>
    <line x1="638" y1="410" x2="582" y2="466"/>
  </g>
  <!-- front wheel -->
  <circle cx="200" cy="438" r="74" fill="#0a2517"/>
  <circle cx="200" cy="438" r="44" fill="url(#rimMoto)"/>
  <circle cx="200" cy="438" r="10" fill="#475e52"/>
  <g stroke="#7f968a" stroke-width="3" opacity="0.7">
    <line x1="200" y1="398" x2="200" y2="478"/>
    <line x1="160" y1="438" x2="240" y2="438"/>
    <line x1="172" y1="410" x2="228" y2="466"/>
    <line x1="228" y1="410" x2="172" y2="466"/>
  </g>
  <!-- frame: rear swingarm -->
  <path d="M460 360 L610 438" stroke="#1f5d3a" stroke-width="18" stroke-linecap="round"/>
  <!-- frame: down tube -->
  <path d="M260 320 L420 360" stroke="#1f5d3a" stroke-width="18" stroke-linecap="round"/>
  <!-- fuel tank -->
  <path d="M340 290
           C360 250 430 246 470 268
           L490 318
           C492 332 482 342 468 342
           H348
           C336 342 332 328 340 290 Z"
        fill="url(#tankMoto)"/>
  <!-- seat -->
  <path d="M468 312
           H560
           C572 312 580 322 576 332
           L562 352
           C558 358 552 360 546 360
           H470
           Z"
        fill="url(#seatMoto)"/>
  <!-- engine block -->
  <rect x="360" y="338" width="120" height="80" rx="14" fill="#1a2722"/>
  <rect x="378" y="350" width="84" height="14" rx="3" fill="#3a4e44"/>
  <rect x="378" y="372" width="84" height="14" rx="3" fill="#3a4e44"/>
  <rect x="378" y="394" width="84" height="12" rx="3" fill="#3a4e44"/>
  <!-- front fork -->
  <path d="M232 282 L210 412" stroke="#cdd9d2" stroke-width="12" stroke-linecap="round"/>
  <path d="M252 282 L228 412" stroke="#cdd9d2" stroke-width="12" stroke-linecap="round"/>
  <!-- handlebars -->
  <path d="M210 256 L300 232" stroke="#101814" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="232" r="10" fill="#1f5d3a"/>
  <!-- headlight -->
  <circle cx="215" cy="296" r="22" fill="#fff5c8" stroke="#0f3320" stroke-width="3"/>
  <!-- exhaust pipe -->
  <path d="M510 400 L600 392" stroke="#9fb4a6" stroke-width="14" stroke-linecap="round"/>
</svg>
