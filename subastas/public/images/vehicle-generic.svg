<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none" role="img" aria-label="Vehículo">
  <defs>
    <linearGradient id="bgGen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef7f1"/>
      <stop offset="100%" stop-color="#dbece2"/>
    </linearGradient>
    <linearGradient id="bodyGen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f5d3a"/>
      <stop offset="55%" stop-color="#16472c"/>
      <stop offset="100%" stop-color="#0f3320"/>
    </linearGradient>
    <linearGradient id="glassGen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe4d8"/>
      <stop offset="100%" stop-color="#9fc4b0"/>
    </linearGradient>
    <linearGradient id="hubGen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6efe9"/>
      <stop offset="100%" stop-color="#b6c9be"/>
    </linearGradient>
    <radialGradient id="shadowGen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0f3320" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f3320" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGen)"/>
  <ellipse cx="400" cy="495" rx="290" ry="22" fill="url(#shadowGen)"/>
  <!-- SUV/crossover silhouette -->
  <path d="M110 410
           C110 360 140 340 190 332
