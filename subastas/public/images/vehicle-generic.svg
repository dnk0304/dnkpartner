        fill="url(#bodyGen)"/>
  <path d="M126 408 L700 408" stroke="#2a7a4d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- windows -->
  <path d="M270 320
           C282 286 312 262 348 262
           H440
           C476 262 498 282 510 320
           Z"
        fill="url(#glassGen)"/>
  <path d="M520 320
           L592 320
           C602 320 608 312 602 302
           L578 268
           C570 258 558 252 546 252
           H516
           Z"
        fill="url(#glassGen)" opacity="0.92"/>
  <rect x="506" y="262" width="6" height="56" rx="2" fill="#0f3320"/>
  <!-- door handles -->
  <rect x="350" y="380" width="46" height="6" rx="3" fill="#cde0d4" opacity="0.7"/>
  <rect x="466" y="380" width="46" height="6" rx="3" fill="#cde0d4" opacity="0.7"/>
  <!-- lights -->
  <path d="M114 388 H160 C170 388 174 392 174 400 V408 H110 V398 C110 392 112 388 114 388 Z" fill="#fff5c8"/>
  <path d="M690 388 H644 C634 388 630 392 630 400 V408 H704 V398 C704 392 700 388 696 388 Z" fill="#e15555"/>
  <!-- wheel arches -->
  <path d="M160 466 A72 72 0 0 1 304 466 Z" fill="#0a2517"/>
  <path d="M504 466 A72 72 0 0 1 648 466 Z" fill="#0a2517"/>
  <!-- wheels -->
  <circle cx="232" cy="474" r="52" fill="#0a2517"/>
  <circle cx="576" cy="474" r="52" fill="#0a2517"/>
  <circle cx="232" cy="474" r="30" fill="url(#hubGen)"/>
  <circle cx="576" cy="474" r="30" fill="url(#hubGen)"/>
  <circle cx="232" cy="474" r="9" fill="#475e52"/>
  <circle cx="576" cy="474" r="9" fill="#475e52"/>
