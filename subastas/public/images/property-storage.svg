<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#CBD5E1"/>
  
  <!-- Floor -->
  <rect y="450" width="800" height="150" fill="#475569"/>
  
  <!-- Storage Room -->
  <rect x="250" y="200" width="300" height="250" fill="url(#wallGrad)" stroke="#475569" stroke-width="3"/>
  
  <!-- Door -->
  <rect x="330" y="330" width="140" height="120" fill="#7C2D12" stroke="#6B2C12" stroke-width="3"/>
  
  <!-- Door Handle/Lock -->
  <rect x="450" y="385" width="15" height="30" fill="#F59E0B" stroke="#D97706" stroke-width="2" rx="3"/>
  
  <!-- Shelving Units (visible through semi-transparent door effect) -->
  <g opacity="0.3">
    <rect x="270" y="230" width="80" height="15" fill="#334155"/>
    <rect x="270" y="270" width="80" height="15" fill="#334155"/>
    <rect x="270" y="310" width="80" height="15" fill="#334155"/>
    
    <rect x="450" y="230" width="80" height="15" fill="#334155"/>
    <rect x="450" y="270" width="80" height="15" fill="#334155"/>
    <rect x="450" y="310" width="80" height="15" fill="#334155"/>
  </g>
  
  <!-- Boxes stacked -->
  <rect x="270" y="350" width="40" height="40" fill="#A16207" stroke="#92400E" stroke-width="2"/>
  <rect x="275" y="320" width="35" height="35" fill="#CA8A04" stroke="#A16207" stroke-width="2"/>
  
  <rect x="490" y="360" width="35" height="35" fill="#CA8A04" stroke="#A16207" stroke-width="2"/>
  <rect x="495" y="330" width="30" height="30" fill="#A16207" stroke="#92400E" stroke-width="2"/>
  
  <!-- Room Number Sign -->
  <rect x="360" y="180" width="80" height="40" fill="#1E293B" stroke="#0F172A" stroke-width="2" rx="3"/>
  <text x="400" y="205" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#F1F5F9" text-anchor="middle">45B</text>
  
  <!-- Ventilation grate -->
  <rect x="370" y="220" width="60" height="25" fill="#334155" stroke="#1E293B" stroke-width="2"/>
  <line x1="375" y1="225" x2="375" y2="240" stroke="#64748B" stroke-width="1"/>
  <line x1="385" y1="225" x2="385" y2="240" stroke="#64748B" stroke-width="1"/>
  <line x1="395" y1="225" x2="395" y2="240" stroke="#64748B" stroke-width="1"/>
  <line x1="405" y1="225" x2="405" y2="240" stroke="#64748B" stroke-width="1"/>
  <line x1="415" y1="225" x2="415" y2="240" stroke="#64748B" stroke-width="1"/>
  <line x1="425" y1="225" x2="425" y2="240" stroke="#64748B" stroke-width="1"/>
</svg>
